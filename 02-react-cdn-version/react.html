<html lang="es">
    <head>
        <title>DevJobs - Empleos</title>
        <meta charset="UTF-8" />    <!-- Configuración de codificación de caracteres -->
        <meta name="description" content="Listado con empleos y filtros para encontrar el trabajo de tus sueños.." /> <!-- Descripción de la página -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />  <!-- Para hacer responsive la web-->
        
        <link rel="stylesheet" href="./style.css" /> <!-- Enlazar el archivo CSS externo -->

        <script type="module">
            import React from "https://esm.sh/react?dev"; // Importar React desde un CDN,cdn es
            import ReactDOM from "https://esm.sh/react-dom/client?dev"; // ayuda a renderizarse en diferentes 
            // entornos, como el navegador o el servidor. ReactDOM se utiliza para renderizar componentes
            //  React en el DOM del navegador.
            
            window.React = React; // Asignar React al objeto global window para que esté disponible en el ámbito global.
            window.ReactDOM = ReactDOM; // Asignar ReactDOM al objeto global window para que esté disponible en el ámbito global.
        </script>

        <script src="https://unpkg.com/@babel/standalone/babel.min.js">
        </script>

        <script type="text/babel">
            function JobCard({titulo, empresa, ubicacion, descripcion}){
                const [isApplied, setIsApplied] = React.useState(false)
                    //Aqui tenemos una const array, primer posicion es el valor actual, el segundo el que cambia el valor, es = a lo que indiquemos con useState

                function handleClick(){
                    setIsApplied(!isApplied)
                }

                const text = isApplied ? 'Aplicado' : "Aplicar"
                const buttonClass = isApplied ? 'Aplicado' : 'Aplicar'

                return (
                    <article 
                        className="job-listing-card"
                    >
                        <div>
                            <h3>{titulo}</h3>
                            <small>{empresa} | {ubicacion}</small>
                            <p>{descripcion}</p>
                        </div>
                        <button 
                        className={`button-apply-job ${buttonClass}`}
                        disabled={isApplied}
                        onClick={handleClick}                                      
                        >
                            {text}
                        </button>
                    </article>
                )
            }
            

            function App(){
                return (
                    <section>
                        <h2>Empleos disponibles</h2>
                        <div className="jobs-listings">
                            <JobCard
                                titulo="Desarrollador Frontend React"
                                empresa="Tech Solutions"
                                ubicacion="Remoto"
                                descripcion="Buscamos un desarrollador frontend con experiencia en React"
                            />
                            <JobCard
                                titulo="Desarrollador Backend Node.js"
                                empresa="Innovatech"
                                ubicacion="Ciudad de México"
                                descripcion="Se requiere un desarrollador backend con experiencia en Node.js y Express"
                            />
                            <JobCard
                                titulo="Desarrollador Full Stack"
                                empresa="Global Tech"
                                ubicacion="Remoto"
                                descripcion="Estamos buscando un desarrollador full stack con experiencia en React y Node.js"
                            />
                        </div>
                    </section>
            )}

            // Renderizar
            window.onload = () => {
                const rootEl = document.querySelector('#root')
                const root = ReactDOM.createRoot(rootEl)
                root.render(<App />)
            }

        
        </script>

    </head>

    <body>

        <header>
            <h1>
                    <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <polyline points="16 18 22 12 16 6"></polyline>
                        <polyline points="8 6 2 12 8 18"></polyline>
                    </svg>
                    DevJobs
                </h1>
               <nav>
                <!-- <a href="">
                    Inicio
                    </a> -->
                    <a href="">Empleos</a>
                </nav>
                <div>
                    <devjobs-avatar username="dacoder91"></devjobs-avatar>
                </div>

        </header>


        <main>
            <section class="jobs-search">
                <h1>React, primeros pasos</h1>
            </section>
            <section>
                <h2>Empleos disponibles</h2>  
                <div id="root"></div>              
            </section>
        </main>

        <footer style="padding-bottom: 2000px;">
            <small>&copy; 2025 DevJobs. Todos los derechos reservados.</small>
        </footer>

    </body>

</html>
